<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex — IA local</title>
  <style>
    :root {
      --bg: #0f0f12;
      --bg-sidebar: #16161c;
      --bg-msg-user: #2a2a35;
      --bg-msg-alex: #1c1c24;
      --border: #2a2a35;
      --text: #e8e8ed;
      --text-muted: #8b8b9a;
      --accent: #7c6af5;
      --accent-hover: #9486f7;
      --green: #3dd68c;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      flex-shrink: 0;
    }
    .sidebar h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar h1 span.dot {
      width: 10px; height: 10px;
      background: var(--green);
      border-radius: 50%;
      display: inline-block;
    }
    .sidebar .subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .sidebar-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.9rem;
      text-align: left;
      margin-bottom: 8px;
      transition: background 0.15s, border-color 0.15s;
    }
    .sidebar-btn:hover {
      background: var(--bg-msg-user);
      border-color: var(--accent);
    }
    .sidebar-footer {
      margin-top: auto;
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .stats-box {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 12px;
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .stats-box strong { color: var(--text); }

    /* Main chat area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--text-muted);
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg .avatar {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      flex-shrink: 0;
    }
    .msg.user .avatar { background: var(--accent); color: #fff; }
    .msg.alex .avatar { background: #2d2d3a; color: var(--green); }
    .msg .bubble {
      background: var(--bg-msg-alex);
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble { background: var(--bg-msg-user); }
    .msg .meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Thinking indicator */
    .thinking {
      display: none;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 8px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
      align-items: center;
      gap: 8px;
    }
    .thinking.visible { display: flex; }
    .thinking .dots span {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .thinking .dots span:nth-child(2) { animation-delay: 0.15s; }
    .thinking .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* Input area */
    .input-area {
      padding: 16px 24px 24px;
      border-top: 1px solid var(--border);
    }
    .input-wrap {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      background: var(--bg-msg-user);
      border-radius: var(--radius);
      padding: 8px 8px 8px 16px;
      border: 1px solid var(--border);
      transition: border-color 0.15s;
    }
    .input-wrap:focus-within { border-color: var(--accent); }
    .input-wrap textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.95rem;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      padding: 8px 0;
    }
    .input-wrap button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 40px; height: 40px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      align-self: flex-end;
    }
    .input-wrap button:hover { background: var(--accent-hover); }
    .input-wrap button:disabled { opacity: 0.4; cursor: not-allowed; }
    .hint {
      max-width: 720px;
      margin: 8px auto 0;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Mobile */
    @media (max-width: 700px) {
      .sidebar { display: none; }
      .messages, .input-area { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h1><span class="dot"></span> Alex</h1>
    <p class="subtitle">IA local · sin APIs externas</p>

    <button class="sidebar-btn" onclick="nuevaConversacion()">＋ Nueva conversación</button>
    <button class="sidebar-btn" onclick="mostrarStats()">📊 Estadísticas</button>
    <button class="sidebar-btn" onclick="feedback(true)">👍 Última respuesta bien</button>
    <button class="sidebar-btn" onclick="feedback(false)">👎 Última respuesta mal</button>
    <button class="sidebar-btn" onclick="borrarMemoria()">🗑 Borrar memoria</button>

    <div class="stats-box" id="statsBox">
      Cargando stats…
    </div>

    <div class="sidebar-footer">
      Puedes enseñarle definiciones<br>
      (<em>X significa Y</em>), sinónimos<br>
      (<em>casa = hogar</em>) y corregirlo.
    </div>
  </aside>

  <div class="main">
    <div class="chat-header">Conversación actual</div>
    <div class="messages" id="messages"></div>
    <div class="thinking" id="thinking">
      <span>Alex está pensando</span>
      <span class="dots"><span></span><span></span><span></span></span>
    </div>
    <div class="input-area">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="Escribe un mensaje…" 
                  onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviar();}"></textarea>
        <button id="btnSend" onclick="enviar()" title="Enviar">➤</button>
      </div>
      <p class="hint">Enter para enviar · Shift+Enter para nueva línea</p>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const thinkingEl = document.getElementById("thinking");
    const btnSend = document.getElementById("btnSend");
    const statsBox = document.getElementById("statsBox");

    // Auto-resize textarea
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    });

    function addMsg(rol, texto) {
      const div = document.createElement("div");
      div.className = "msg " + rol;
      const avatar = rol === "user" ? "Tú" : "A";
      div.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div>
          <div class="bubble">${escapeHtml(texto)}</div>
        </div>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(t) {
      const d = document.createElement("div");
      d.textContent = t;
      return d.innerHTML;
    }

    async function enviar() {
      const texto = inputEl.value.trim();
      if (!texto) return;
      inputEl.value = "";
      inputEl.style.height = "auto";
      addMsg("user", texto);
      thinkingEl.classList.add("visible");
      btnSend.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje: texto }),
        });
        const data = await res.json();
        addMsg("alex", data.respuesta || "(sin respuesta)");
        cargarStats();
      } catch (e) {
        addMsg("alex", "Error de conexión con el servidor. ¿Está corriendo web_server.py?");
      } finally {
        thinkingEl.classList.remove("visible");
        btnSend.disabled = false;
        inputEl.focus();
      }
    }

    async function cargarStats() {
      try {
        const res = await fetch("/api/stats");
        const s = await res.json();
        statsBox.innerHTML = `
          <strong>Memoria</strong><br>
          Mensajes: ${s.mensajes_totales || 0}<br>
          Palabras: ${s.palabras || 0}<br>
          Temas: ${s.temas || 0}<br>
          Sinónimos: ${s.sinonimos || 0}
        `;
      } catch (_) {
        statsBox.textContent = "Stats no disponibles";
      }
    }

    async function feedback(positiva) {
      try {
        await fetch("/api/feedback", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ positiva }),
        });
        addMsg("alex", positiva
          ? "¡Gracias! Reforzaré ese tipo de respuestas."
          : "Entendido, ajustaré mis criterios.");
      } catch (_) {}
    }

    async function borrarMemoria() {
      if (!confirm("¿Borrar TODA la memoria de Alex?")) return;
      try {
        await fetch("/api/borrar_memoria", { method: "POST" });
        addMsg("alex", "Memoria borrada por completo.");
        cargarStats();
      } catch (_) {}
    }

    function nuevaConversacion() {
      messagesEl.innerHTML = "";
      addMsg("alex", "¡Hola! Soy Alex. ¿En qué puedo ayudarte hoy?");
    }

    // Init
    nuevaConversacion();
    cargarStats();
    inputEl.focus();
  </script>
</body>
</html>
